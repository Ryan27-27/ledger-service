# Full stack:  docker compose up --build
#   UI       http://localhost:3000
#   API      http://localhost:8080   (Swagger UI: /swagger-ui.html)
#
# Demo credentials (override via .env, see .env.example):
#   admin / admin-password-123   -> can credit, reverse, and browse every account
name: fullstack-ledger
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_pass}
    volumes:
      - ledger_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./ledger-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ledger_pass}
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-only-secret-change-me-32bytes-min}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin-password-123}
      # Lets a normal user credit/reverse on their OWN account so the UI is fully
      # usable as a demo. Set to false for production-like behaviour.
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./ledger-frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ledger_pg_data:
