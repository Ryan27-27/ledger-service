name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests start Postgres/Redis with Testcontainers (Docker is preinstalled on ubuntu-latest)
      - run: mvn -B verify

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ledger-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack-smoke:
    name: Full stack boots (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 240
      - name: Meta endpoint reachable through the UI's reverse proxy
        run: curl --fail --silent http://localhost:3000/api/v1/meta
      - name: Log in as the bootstrapped admin
        run: |
          curl --fail --silent -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin-password-123"}' | grep -q '"role":"ADMIN"'
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
